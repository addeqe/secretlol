name: Import meal database over five days
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: willys-cloud-writes
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
      MEAL_DATABASE_ID: ${{ vars.MEAL_DATABASE_ID }}
      GH_TOKEN: ${{ github.token }}
      MAX_D1_ROWS_WRITTEN: '9000'
      MAX_D1_SIZE_MB: '480'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Download pinned release data
        run: |
          mkdir -p data/meal-release
          tag=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("meal-data/manifest.json")).releaseTag)')
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'common.json.gz' --pattern 'day-*.jsonl.gz' --dir data/meal-release
      - name: Import at most one fifth per UTC day
        run: npm run meal:upload
      - name: Use cloud ingredient inventory
        run: npm run ingredients:refresh
      - name: Summarize upload progress
        run: |
          node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync("data/last-meal-import-report.json")); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,JSON.stringify(r,null,2)+"\n")'
      - name: Disable this workflow after the verified fifth part
        if: ${{ always() }}
        run: |
          if [ ! -f data/last-meal-import-report.json ]; then exit 0; fi
          complete=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("data/last-meal-import-report.json")).complete === true)')
          if [ "$complete" = "true" ]; then
            gh workflow disable meal-upload.yml --repo "$GITHUB_REPOSITORY"
          fi
